openapi: 3.0.3
info:
  title: AI Todo Agent Chat API
  description: API for interacting with the AI Todo Agent
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server

paths:
  /api/{user_id}/chat:
    post:
      summary: Process user message with AI agent
      description: Sends a message to the AI agent and receives a response
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the user sending the message
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response from AI agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Natural language instruction to process
          example: "Add a new task: Buy groceries"
          minLength: 1
          maxLength: 1000
        conversation_id:
          type: integer
          description: Optional existing conversation ID (if continuing conversation)
          example: 123

    ChatResponse:
      type: object
      required:
        - response
        - conversation_id
        - timestamp
      properties:
        response:
          type: string
          description: AI-generated response message
          example: "I've added the task 'Buy groceries' to your list."
        conversation_id:
          type: integer
          description: Assigned or existing conversation ID
          example: 123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: "2023-12-01T10:00:00Z"
        task_operations:
          type: array
          items:
            $ref: '#/components/schemas/TaskOperationResult'

    TaskOperationResult:
      type: object
      properties:
        operation:
          type: string
          enum: [add_task, update_task, complete_task, delete_task, list_tasks]
          description: The type of task operation performed
        success:
          type: boolean
          description: Whether the operation was successful
        result:
          type: object
          description: Result data from the operation

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message
          example: "Invalid input data"